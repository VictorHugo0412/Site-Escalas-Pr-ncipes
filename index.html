<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escalas Príncipes Mayas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fffaf0;--sf:#fff;--tx:#1d1700;--mu:#6b5a1d;--g1:#f1c232;--g2:#ffd966;--g3:#fff2cc;--gr:#ccc;--bd:#e6d28a;--rd:#c00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171203;--sf:#241c06;--tx:#fdf3cf;--mu:#cdb867;--bd:#5a4a14;--g3:#3a2e0a;--gr:#555;--rd:#ff7b7b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#171203;--sf:#241c06;--tx:#fdf3cf;--mu:#cdb867;--bd:#5a4a14;--g3:#3a2e0a;--gr:#555;--rd:#ff7b7b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
header.top{background:var(--g1);color:#1d1700;text-align:center;padding:12px;border-radius:14px;font-weight:800;margin-bottom:12px}
header.top small{display:block;font-weight:600;background:var(--g2);border-radius:8px;margin-top:6px;padding:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:1.2rem}h3{margin:0 0 6px;font-size:1.05rem;background:var(--g2);color:#1d1700;padding:6px 10px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:10px 14px}
button.on,.pill.on{background:var(--g1);color:#1d1700;border-color:var(--g1);font-weight:700}
button.go{width:100%;background:var(--g1);color:#1d1700;font-weight:800;border-color:var(--g1);padding:14px;margin-top:8px}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;margin:8px 0;font-weight:600}
.dia{border:1px solid var(--bd);border-radius:10px;margin:6px 0;overflow:hidden}.dia.on{border-color:var(--g1);background:var(--g3)}
.dbtn{width:100%;display:flex;justify-content:space-between;gap:8px;border:0;background:none;text-align:left}.dbtn span{color:var(--mu);font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}.chip{padding:6px 10px;font-size:.85rem;border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;font-size:.72rem;background:var(--g2);color:#1d1700;border-radius:6px;padding:3px 0}
.cal button{padding:6px 2px;min-height:54px;font-size:.95rem;line-height:1.15}.cal small{display:block;font-size:.6rem;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal button.tk{background:var(--gr);color:#222}.cal button.on small{color:#1d1700}.cal i{display:block}
.mentors{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin:6px 0 12px}.mentors figure{margin:0;text-align:center}.mentors figcaption{font-weight:700;font-size:.85rem;margin-top:4px}.mentors img{height:150px;border-radius:12px;border:3px solid var(--g1);object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(92vw,520px);background:var(--rd);color:#fff;padding:12px 14px;border-radius:12px;z-index:50;font-weight:600}
.ed{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#1d1700;color:var(--g2);border-color:var(--g1);z-index:20;font-weight:700}
.ov{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 40px}.ov>div{max-width:900px;margin:0 auto}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1}
.tw{overflow-x:auto}table{border-collapse:collapse;font-size:.85rem;min-width:100%}td{border:1px solid var(--bd);padding:4px 8px;white-space:nowrap}td.hd{background:var(--g1);color:#1d1700;font-weight:800}td.ti{background:var(--g2);color:#1d1700;font-weight:800}td.lb{background:var(--g3);font-weight:700}
.splash{position:fixed;inset:0;background:var(--g1);color:#1d1700;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;text-align:center;cursor:pointer}
.splash h1{font-size:clamp(2.8rem,14vw,6rem);margin:0;animation:pop .6s ease-out}.splash p{font-weight:700}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.splash h1{animation:none}}
.muted{color:var(--mu);font-size:.9rem}.big{font-size:2.4rem;text-align:center;margin:10px 0}
</style></head><body>

function s1(){return `<div class="card"><div class="mentors"><figure><img src="${M0}" alt="Príncipe Ariane"><figcaption>Príncipe Ariane</figcaption></figure><figure><img src="${M1}" alt="Ministro Yuricy"><figcaption>Ministro Yuricy</figcaption></figure></div><p class="muted" style="text-align:center;margin:0 0 8px">Mentores da Falange</p>
<h2>Quem é você?</h2><div class="row">${["Doutrinador","Apará"].map(m=>`<button class="pill ${S.med===m?"on":""}" data-a="med" data-v="${m}">${m}</button>`).join("")}</div>
<label>Missionário<select id="nome"><option value="">Selecione seu nome…</option>${cfg.names.map(n=>`<option ${S.nome===n?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
<button class="go" data-a="next1">Continuar</button></div>`}
const gcount=med=>parts.filter(p=>p.guardiao&&p.med===med&&p.id!==me()).length;
function s2(){const D=dias(),d1=dom1();
 const g=d1?`<div class="card"><b>${esc(cfg.pergunta.replace("{data}",fmt(d1)))}</b><p class="muted" style="margin:4px 0">Vagas de guardião (${S.med}): ${gcount(S.med)}/${cfg.limite} preenchidas por outros</p><div class="row"><button class="pill ${S.guard===true?"on":""}" data-a="g" data-v="1">Sim</button><button class="pill ${S.guard===false?"on":""}" data-a="g" data-v="0">Não</button></div></div>`:"";
 const ds=D.filter(d=>[0,3,6].includes(d.getDay())).map(d=>{const k=key(d),on=S.cortes[k];return `<div class="dia ${on?"on":""}"><button class="dbtn" data-a="dia" data-v="${k}"><span style="color:inherit"><b>${fmt(d)}</b> · ${DS[d.getDay()]}${key(d)===csab()||key(d)===cdom()?" · CONSAGRAÇÃO":""}</span><span>${on?"✓ marcado":"Marcar"}</span></button>${on?`<div class="chips">${on.map(t=>`<span class="chip on">${esc(t)}</span>`).join("")}</div>`:""}</div>`}).join("");
 const cs=csab(),es=cs&&S.med==="Doutrinador"?`<div class="card"><b>Você deseja participar das Espadas da Centúria no dia ${cs.slice(8)}/${cs.slice(5,7)} (sábado de consagração)?</b><p class="muted" style="margin:4px 0">Somente doutrinador · ${cfg.limEsp} vagas · ${parts.filter(p=>p.espadas&&p.id!==me()).length}/${cfg.limEsp} preenchidas por outros</p><div class="row"><button class="pill ${S.esp===true?"on":""}" data-a="esp" data-v="1">Sim</button><button class="pill ${S.esp===false?"on":""}" data-a="esp" data-v="0">Não</button></div></div>`:"";const lead=D[0].getDay();let cal=DC.map(c=>`<b>${c}</b>`).join("")+"<span></span>".repeat(lead);
 D.forEach(d=>{const k=key(d),o=energ[k],mine=S.energia.includes(k),tk=o&&o.slug!==me();cal+=`<button class="${mine?"on":""} ${tk?"tk":""}" data-a="en" data-v="${k}"><i>${d.getDate()}</i>${tk?`<small>${esc(o.nome.split(" ")[0])}</small>`:mine?"<small>você</small>":""}</button>`});
 return `${g}${es}<div class="card"><h3>Escalas de Cortes</h3><p class="muted">Quartas, sábados e domingos de ${label()}. Marque quantos quiser e escolha os trabalhos.</p>${ds}<label>Observações<textarea id="obs" rows="3" placeholder="Alguma observação?">${esc(S.obs)}</textarea></label></div>
<div class="card"><h3>Escala de entrega de energias</h3><p class="muted">Marque os dias do mês (sem limite). Dias em cinza já têm outro missionário.</p><div class="cal">${cal}</div></div>
<button class="go" data-a="send">Finalizar escala</button><button style="width:100%;margin-top:8px" data-a="back">Voltar</button>`}
const s3=()=>`<div class="card" style="text-align:center"><div class="big">🙏</div><h2>Obrigado!</h2><p>Sua escala de ${label()} foi registrada, ${esc(S.nome)}.</p><button data-a="back">Revisar / alterar minha escala</button></div>`;
function load(){const p=parts.find(x=>x.id===me());S.guard=null;S.esp=null;S.cortes={};S.energia=[];S.obs="";
 if(p){S.esp=p.espadas?true:(csab()?false:null);S.guard=p.guardiao?true:(dom1()?false:null);S.cortes=p.cortes||{};S.energia=p.energia||[];S.obs=p.obs||""}
 S.energia=S.energia.filter(k=>k.startsWith(YM))}
async function send(){const slug=me();
 for(const k of S.energia){const o=energ[k];if(o&&o.slug!==slug)return toast(`O dia ${k.slice(8)}/${k.slice(5,7)} já está preenchido por ${o.nome}. Altere a data.`)}
 if(S.guard===true&&gcount(S.med)>=cfg.limite)return toast(`O limite de ${cfg.limite} guardiões (${S.med}) já foi atingido.`);
 if(S.esp===true&&parts.filter(p=>p.espadas&&p.id!==slug).length>=cfg.limEsp)return toast(`As ${cfg.limEsp} vagas das Espadas da Centúria já foram preenchidas.`);
 const b=document.querySelector("[data-a=send]");if(b){b.disabled=true;b.textContent="Enviando…"}
 try{const r=await(await fetch(API,{method:"POST",body:JSON.stringify({mes:YM,nome:S.nome,med:S.med,guardiao:S.guard===true,espadas:S.esp===true&&S.med==="Doutrinador",cortes:S.cortes,energia:S.energia,obs:S.obs})})).json();
  if(!r.ok){await carregar();render();return toast(r.erro||"Não foi possível salvar.")}
  await carregar();step=3;render();scrollTo(0,0)}catch(e){render();toast("Erro ao enviar. Verifique a internet e tente de novo.")}}
/* planilha */
function aoa(){const D=dias(),A=[],names=(k,t)=>t===ESP?parts.filter(p=>p.espadas).map(p=>p.nome):parts.filter(p=>(p.cortes||{})[k]&&p.cortes[k].includes(t)).map(p=>p.nome);
 A.push(["- "+label().replace(" / "," / 20").toUpperCase()+" -"]);
 D.filter(d=>[0,3,6].includes(d.getDay())).forEach(d=>{const k=key(d);A.push([fmt(d)+" - "+DS[d.getDay()]]);
  if(d.getDay()===0&&k===key(dom1())){A.push(["GUARDIÃO - BENÇÃO"]);["Doutrinador","Apará"].forEach(m=>A.push(["",m.toUpperCase(),...parts.filter(p=>p.guardiao&&p.med===m).map(p=>p.nome)]))}
  trabDia(d).forEach(t=>A.push([t,...names(k,t)]))});
 A.push(["ENTREGA DE ENERGIAS"]);A.push(["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"]);
 for(let i=0;i<D.length;){const a=Array(7).fill(""),b=Array(7).fill("");let c=i?0:D[0].getDay();while(c<7&&i<D.length){a[c]=fmt(D[i]);b[c]=(energ[key(D[i])]||{}).nome||"";c++;i++}A.push(a,b)}
 const ob=parts.filter(p=>p.obs);if(ob.length){A.push(["OBSERVAÇÕES"]);ob.forEach(p=>A.push([p.nome,p.obs]))}
 return A}
const plan=()=>{const A=aoa(),W=Math.max(...A.map(r=>r.length));return `<div class="tw"><table>${A.map((r,i)=>{const h=r.length===1;return `<tr>${h?`<td class="${i?"hd":"ti"}" colspan="${W}">${esc(r[0])}</td>`:Array.from({length:W},(_,j)=>`<td class="${j===0&&r[0]&&!/^\d/.test(r[0])?"lb":""}">${esc(r[j]||"")}</td>`).join("")}</tr>`}).join("")}</table></div><button class="go" data-a="xlsx">Baixar planilha (.xlsx)</button><p class="muted">${parts.length} missionário(s) já responderam. Para editar um nome/dia, o missionário reabre o app e altera.</p>`};
function panel(){return `<div class="ov"><div><div class="row" style="justify-content:space-between"><h2>Planilha · ${label()}</h2><button data-a="close">Fechar</button></div>${aviso()}${plan()}</div></div>`}
app.addEventListener("input",e=>{if(e.target.id==="obs")S.obs=e.target.value});
app.addEventListener("change",e=>{if(e.target.id==="nome")S.nome=e.target.value});
app.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="start"){step=1}
 else if(a==="med")S.med=v;
 else if(a==="next1"){if(!S.med||!S.nome)return toast("Escolha a mediunidade e o seu nome.");await carregar();load();step=2}
 else if(a==="back"){step=a==="back"&&step===3?2:1}
 else if(a==="g"){if(v==="1"&&gcount(S.med)>=cfg.limite)return toast(`O limite de ${cfg.limite} guardiões (${S.med}) já foi atingido.`);S.guard=v==="1"}
 else if(a==="esp"){if(v==="1"){if(parts.filter(p=>p.espadas&&p.id!==me()).length>=cfg.limEsp)return toast(`As ${cfg.limEsp} vagas das Espadas da Centúria já foram preenchidas.`);if(S.energia.includes(csab()))return toast("Você já marcou o sábado de consagração na entrega de energias. Altere uma das duas.")}S.esp=v==="1"}
 else if(a==="dia"){if(S.cortes[v])delete S.cortes[v];else{if(S.energia.includes(v))return toast(`Você já marcou ${v.slice(8)}/${v.slice(5,7)} na entrega de energias. Não dá para usar o mesmo dia nas duas escalas, altere uma delas.`);const d=new Date(v+"T12:00:00");S.cortes[v]=padDia(d)}}
 else if(a==="trab"){const l=S.cortes[v],t=b.dataset.t;S.cortes[v]=l.includes(t)?l.filter(x=>x!==t):[...l,t]}
 else if(a==="en"){const o=energ[v],f=v.slice(8)+"/"+v.slice(5,7);
  if(S.energia.includes(v))S.energia=S.energia.filter(x=>x!==v);
  else if(o&&o.slug!==me())return toast(`O dia ${f} já está preenchido por ${o.nome}. Escolha outra data ou peça para ele alterar.`);
  else if(S.cortes[v]||(S.esp&&v===csab()))return toast(`Você marcou ${f} em Escalas de Cortes. Esse dia não pode ir também para entrega de energias, altere uma das duas.`);
  else S.energia.push(v)}
 else if(a==="send")return send();
 else if(a==="ed")ed="plan";else if(a==="close")ed=null;
 else if(a==="xlsx"){try{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa()),"Página1");XLSX.writeFile(wb,`Escala-${YM}.xlsx`)}catch(x){toast("Não foi possível baixar a planilha.")}return}
 render();if(["start","next1","back"].includes(a))scrollTo(0,0)});
render();
canEdit=location.hash==="#editor";render();carregar();setInterval(()=>{if(step===2&&!ed)carregar()},30000);
</script></body></html>
